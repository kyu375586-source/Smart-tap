workflows:
  android-release:
    name: Smart Tap Android Release APK Build
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - upload_keystore
      vars:
        PACKAGE_NAME: "com.aistudio.smarttap.wvyxqm"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Build Android Release APK and Bundle
        script: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace
          else
            gradle assembleRelease --stacktrace
          fi
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - kyu375586@gmail.com
        notify:
          on_build_failure: true
          on_build_success: true
