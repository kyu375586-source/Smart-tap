workflows:
  android-release-workflow:
    name: Smart Tap Android Release APK Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      android_signing:
        - upload_keystore
      groups:
        - google_play
      vars:
        PACKAGE_NAME: "com.aistudio.smarttap.wvyxqm"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up local properties and Gradle permissions
        script: |
          chmod +x gradlew || true
      - name: Build Android Release APK
        script: |
          gradle assembleRelease --stacktrace
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt
    publishing:
      email:
        recipients:
          - kyu375586@gmail.com
        notify:
          on_build_failure: true
          on_build_success: true
